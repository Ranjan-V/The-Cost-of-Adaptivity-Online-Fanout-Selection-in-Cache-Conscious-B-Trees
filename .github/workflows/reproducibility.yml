name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-source:
    name: Anonymous paper source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: sigmod_submission
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Compile review appendix
        uses: xu-cheng/latex-action@v3
        with:
          root_file: appendix.tex
          working_directory: sigmod_submission
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: sigmod-submission-anonymous
          path: |
            sigmod_submission/main.pdf
            sigmod_submission/appendix.pdf
